name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust and coverage tools
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all
      - run: cargo bench --locked
      - run: python3 scripts/coverage.py
      - run: cargo build --locked --release
      - name: Accuracy, artifact tooling and measurement contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tests/detection_evaluator.py
          python3 -m unittest discover -s tests -p '*tools.py'
          python3 scripts/detection_baseline.py --check
