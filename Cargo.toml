[package]
name = "rayloc"
version = "2026.10.4"
edition = "2024"
rust-version = "1.85"
description = "A fast, automatically redacting secret scanner for Git workflows"
license = "MIT"
repository = "https://github.com/nhtua/rayloc"
publish = ["crates-io"]
readme = "README.md"
include = ["src/**/*.rs", "tests/**/*.rs", "tests/*.py", "tests/corpus/**", "tests/README.md", "benches/*.rs", "benches/README.md", "scripts/*.py", "scripts/*.c", "docs/release.md", "docs/hooks.md", "docs/research/detection-baseline.json", "docs/research/release-baseline.md", "docs/research/release-baseline.json", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", ".pre-commit-hooks.yaml", ".rayloc.yaml", ".raylocignore"]

[dependencies]
yaml-rust2 = { version = "=0.13.0", default-features = false }
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
regex-syntax = "=0.8.11"
ignore = "=0.4.29"
globset = "=0.4.19"
rayon = "=1.12.0"

[[bench]]
name = "engine"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "scope"
harness = false
