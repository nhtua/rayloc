[package]
name = "rayloc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, automatically redacting secret scanner for Git workflows"
license = "MIT"
repository = "https://github.com/nhtua/rayloc"
publish = false

[dependencies]
yaml-rust2 = { version = "=0.13.0", default-features = false }
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
regex-syntax = "=0.8.11"
ignore = "=0.4.29"

[[bench]]
name = "engine"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
